<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Call Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="overlay">
    <div id="card" class="card" role="group" aria-label="Chamada para ligar">
      <div id="icon" class="icon" aria-hidden="true">
        <!-- phone icon -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M6.6 10.8c1.4 2.6 4 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4c0-.6.4-1 1-1h3.3c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.7.1.4 0 .8-.3 1.1L6.6 10.8Z"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="text">
        <div id="title" class="label">Liga agora</div>
        <div id="phone" class="number">+351 912 345 678</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
